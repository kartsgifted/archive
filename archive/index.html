<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 — 워크숍 아카이브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --ink-950:#08090A;
    --ink-900:#111214;
    --ink-800:#1A1B1E;
    --ink-700:#2A2C30;
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.07);

    --gold:#C9A227;
    --gold-soft:#D9BB63;
    --cream:#EEEBE3;
    --cream-dim:#9B978D;

    --dance:#D9695E;
    --art:#4A9BC2;
    --music:#9B7FD4;
    --trad:#C79A4E;

    --font-display:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-950);
    color:var(--cream);
    font-family:var(--font-body);
    font-weight:400;
    word-break:keep-all;
    overflow-wrap:break-word;
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:var(--ink-950);}
  button, input{font-family:inherit;}
  .hidden{display:none !important;}
  img{display:block;}
  #gate-screen .bg-photo,
  .hero-band img,
  .tile img,
  .schedule-banner img{
    background:var(--ink-950);
    filter:brightness(.62) saturate(.92) contrast(1.03);
  }

  /* ---------- viewfinder corner-mark motif (signature element) ---------- */
  .brackets{position:absolute; inset:16px; pointer-events:none; opacity:.9;}
  .brackets i{position:absolute; width:22px; height:22px; border-color:var(--gold);}
  .brackets i:nth-child(1){top:0; left:0; border-top:2px solid; border-left:2px solid;}
  .brackets i:nth-child(2){top:0; right:0; border-top:2px solid; border-right:2px solid;}
  .brackets i:nth-child(3){bottom:0; left:0; border-bottom:2px solid; border-left:2px solid;}
  .brackets i:nth-child(4){bottom:0; right:0; border-bottom:2px solid; border-right:2px solid;}

  /* ---------- gate screen ---------- */
  #gate-screen{
    position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:#000;
  }
  #gate-screen .bg-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.42;
  }
  #gate-screen .bg-scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(8,9,10,.7) 0%, rgba(8,9,10,.85) 55%, rgba(8,9,10,.98) 100%);
  }
  .gate-content{position:relative; z-index:2; width:100%; max-width:460px; text-align:center;}
  .gate-eyebrow{
    font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.28em;
    color:var(--gold-soft); text-transform:uppercase; margin-bottom:18px;
  }
  .gate-title{
    font-family:var(--font-display); font-weight:800; font-size:clamp(28px, 5vw, 38px);
    line-height:1.35; margin-bottom:14px;
  }
  .gate-sub{
    font-size:14px; color:var(--cream-dim); margin-bottom:34px; line-height:1.7;
  }
  .code-input-wrap{position:relative;}
  .code-input{
    width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-radius:2px; padding:16px 18px; color:transparent; caret-color:var(--gold-soft);
    font-family:var(--font-mono); font-weight:600; font-size:18px; letter-spacing:.3em;
    font-variant-numeric:tabular-nums;
    text-align:center; text-transform:uppercase; outline:none;
  }
  .code-input:focus{border-color:var(--gold);}
  .code-input::placeholder{color:var(--cream-dim); letter-spacing:.2em;}
  .code-mask{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:18px; letter-spacing:.3em;
    color:var(--cream); pointer-events:none;
  }
  .gate-btn{
    width:100%; margin-top:14px; padding:16px; border:1px solid var(--gold); border-radius:2px;
    background:transparent; color:var(--gold-soft); font-weight:600; font-size:14px;
    letter-spacing:.05em; cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .gate-btn:hover{background:var(--gold); color:var(--ink-950);}
  .gate-error{margin-top:16px; font-size:13px; color:var(--dance); min-height:18px;}

  /* ---------- app shell ---------- */
  #app-screen{min-height:100vh; display:flex; flex-direction:column;}

  header.top-bar{
    position:sticky; top:0; z-index:30;
    background:var(--ink-950);
    border-bottom:1px solid var(--line-soft);
    padding:20px 40px;
    display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; cursor:pointer;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:18px;}
  .brand-tag{font-family:var(--font-mono); font-weight:600; font-size:9px; letter-spacing:.2em; color:var(--gold-soft); text-transform:uppercase; margin-top:2px;}

  .search-wrap{flex:1 1 320px; position:relative; max-width:520px;}
  .search-wrap input{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    padding:8px 4px 8px 28px; color:var(--cream); font-size:14px; outline:none;
  }
  .search-wrap input:focus{border-color:var(--gold);}
  .search-wrap .icon{position:absolute; left:2px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.55;}
  .top-actions{margin-left:auto;}
  .ghost-btn{
    background:transparent; border:1px solid var(--line); color:var(--cream-dim);
    padding:9px 18px; font-size:12px; cursor:pointer; letter-spacing:.03em;
  }
  .ghost-btn:hover{border-color:var(--gold); color:var(--gold-soft);}

  main{flex:1; width:100%;}
  .content-pad{max-width:1180px; margin:0 auto; padding:0 40px 90px;}

  /* ---------- home layout (title left, tiles right) ---------- */
  .home-layout{display:flex; align-items:flex-start; gap:56px; padding-top:56px; margin-bottom:56px;}
  .home-text{flex:0 0 300px;}
  .hero-eyebrow{font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.24em; color:var(--gold-soft); text-transform:uppercase; margin-bottom:12px;}
  .hero-title{font-family:var(--font-display); font-size:clamp(28px, 3.2vw, 38px); font-weight:800; line-height:1.3; margin-bottom:14px;}
  .hero-desc{color:var(--cream-dim); font-size:14.5px; line-height:1.75;}

  /* ---------- discipline tiles (photo cards) ---------- */
  .tile-grid{flex:1; display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; min-width:0;}
  .tile{
    position:relative; overflow:hidden; cursor:pointer;
    aspect-ratio:16/11; border:1px solid var(--line-soft);
  }
  .tile img{width:100%; height:100%; object-fit:cover; transition:transform .5s ease;
    background:var(--ink-950); filter:brightness(.62) saturate(.92) contrast(1.03);}
  .tile:hover img{transform:scale(1.045);}
  .tile-scrim{
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(8,9,10,.96) 0%, rgba(8,9,10,.55) 45%, rgba(8,9,10,.18) 75%);
  }
  .tile-content{position:absolute; left:28px; right:28px; bottom:24px;}
  .tile-eng{font-family:var(--font-mono); font-weight:600; font-size:10px; letter-spacing:.22em; color:var(--gold-soft); text-transform:uppercase;}
  .tile-name{font-family:var(--font-display); font-size:clamp(24px,2.6vw,32px); font-weight:700; margin:8px 0 6px;}
  .tile-meta{font-family:var(--font-mono); font-weight:500; font-size:12px; color:var(--cream-dim); font-variant-numeric:tabular-nums;}
  .tile .brackets{opacity:0; transition:opacity .2s ease;}
  .tile:hover .brackets{opacity:1;}

  /* ---------- schedule view ---------- */
  .schedule-banner{position:relative; height:220px; overflow:hidden; margin-bottom:36px;}
  .schedule-banner img{width:100%; height:100%; object-fit:cover;}
  .schedule-banner .scrim{position:absolute; inset:0; background:linear-gradient(0deg, rgba(8,9,10,.95) 10%, rgba(8,9,10,.35) 70%);}
  .schedule-banner-content{position:absolute; left:40px; right:40px; bottom:24px; display:flex; align-items:flex-end; gap:18px;}
  .back-btn{
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.3); color:var(--cream);
    width:38px; height:38px; cursor:pointer; font-size:16px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px);
  }
  .back-btn:hover{border-color:var(--gold);}
  .schedule-title{font-family:var(--font-display); font-size:clamp(26px,3.2vw,36px); font-weight:800;}

  .day-group{margin-top:8px;}
  .day-group + .day-group{margin-top:40px;}
  .day-label{
    font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.16em;
    color:var(--gold-soft); text-transform:uppercase; margin-bottom:16px;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }

  /* ---------- schedule timetable (grid) ---------- */
  .schedule-table-wrap{overflow:auto; max-height:68vh; padding-bottom:8px; -webkit-overflow-scrolling:touch; border:1px solid var(--line-soft);}
  table.schedule-grid{border-collapse:separate; border-spacing:0; width:100%; min-width:640px;}
  table.schedule-grid th, table.schedule-grid td{border:1px solid var(--line-soft);}
  table.schedule-grid thead th{
    position:sticky; top:0; z-index:5; background:var(--ink-950);
    padding:14px 10px; text-align:left; vertical-align:bottom;
  }
  table.schedule-grid thead th:first-child{left:0; z-index:7;}
  .th-day-label{font-family:var(--font-display); font-size:16px; font-weight:700;}
  .th-day-sub{font-family:var(--font-mono); font-weight:600; font-size:10px; letter-spacing:.1em; color:var(--gold-soft); text-transform:uppercase; margin-top:2px;}
  .time-col{
    position:sticky; left:0; z-index:4; background:var(--ink-950);
    font-family:var(--font-mono); font-weight:500; font-size:11px; color:var(--cream-dim);
    font-variant-numeric:tabular-nums;
    padding:6px 12px; white-space:nowrap; vertical-align:top; width:64px;
  }
  td.cell-empty{background:repeating-linear-gradient(135deg, transparent, transparent 8px, var(--line-soft) 8px, var(--line-soft) 9px);}
  td.cell-session{
    padding:10px 12px; vertical-align:top; cursor:pointer;
    background:var(--ink-900); transition:background .15s ease;
  }
  td.cell-session:hover{background:var(--ink-800);}
  .cell-class{font-size:13.5px; font-weight:700; line-height:1.35; margin-bottom:4px;}
  .cell-sub{font-size:11.5px; font-weight:400; color:var(--cream-dim); line-height:1.4;}
  .cell-note{font-size:11px; font-weight:500; color:var(--gold-soft); margin-top:4px; line-height:1.4;}
  .cell-state{font-family:var(--font-mono); font-weight:600; font-size:10px; margin-top:6px; color:var(--cream-dim);}
  .cell-state.ready{color:var(--gold-soft);}

  .session-row{
    display:flex; align-items:center; gap:24px;
    padding:20px 4px; border-bottom:1px solid var(--line-soft);
    cursor:pointer; transition:padding-left .15s ease;
  }
  .session-row:hover{padding-left:12px;}


  /* ---------- search results ---------- */
  .student-block{margin-bottom:36px;}
  .student-name{font-family:var(--font-display); font-size:21px; font-weight:700; margin-bottom:14px;}
  .class-chip-list{display:flex; flex-direction:column;}
  .class-chip{
    display:flex; align-items:center; gap:16px;
    border-bottom:1px solid var(--line-soft); padding:16px 4px; cursor:pointer;
  }
  .class-chip:hover{padding-left:12px;}
  .chip-bar{width:3px; height:34px; background:var(--c, var(--gold)); flex:0 0 auto;}
  .chip-field{font-family:var(--font-mono); font-weight:600; font-size:10px; letter-spacing:.14em; color:var(--c, var(--gold)); text-transform:uppercase; margin-bottom:4px;}
  .chip-class{font-size:15px; font-weight:600;}
  .chip-time{font-family:var(--font-mono); font-weight:500; font-size:12px; color:var(--cream-dim); margin-left:auto; white-space:nowrap; font-variant-numeric:tabular-nums;}

  .empty-state{text-align:center; padding:100px 20px; color:var(--cream-dim);}
  .empty-state .big{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--cream); margin-bottom:8px;}
  .view-pad{padding-top:44px;}

  /* ---------- video modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,5,6,.92);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;
  }
  .modal-panel{
    position:relative; width:100%; max-width:1080px; background:var(--ink-900);
    border:1px solid var(--line); max-height:92vh; display:flex; overflow:hidden;
  }
  .modal-main{flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; padding:24px 28px 16px; gap:16px;}
  .modal-eyebrow{font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.16em; color:var(--c, var(--gold-soft)); text-transform:uppercase; margin-bottom:6px;}
  .modal-title{font-family:var(--font-display); font-size:22px; font-weight:700;}
  .modal-close{
    background:none; border:1px solid var(--line); color:var(--cream-dim);
    width:32px; height:32px; border-radius:50%; cursor:pointer; flex:0 0 auto; font-size:14px;
  }
  .modal-close:hover{border-color:var(--gold); color:var(--gold-soft);}
  .video-frame{position:relative; width:100%; padding-top:56.25%; background:#000; flex:0 0 auto;}
  .video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; color:var(--cream-dim); font-family:var(--font-mono); font-weight:600; font-size:13px; text-align:center; padding:0 24px;
  }
  .modal-meta{padding:18px 28px 26px; display:flex; gap:30px; flex-wrap:wrap; font-size:13px; font-weight:500; color:var(--cream-dim); font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .modal-meta b{color:var(--cream); font-family:var(--font-body); font-weight:600;}

  .modal-sidebar{
    width:280px; flex:0 0 auto; border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .sidebar-head{
    padding:18px 20px 12px; font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.14em;
    color:var(--cream-dim); text-transform:uppercase; border-bottom:1px solid var(--line-soft);
  }
  .video-list-item{
    display:flex; align-items:center; gap:12px; padding:16px 20px; cursor:pointer;
    border-bottom:1px solid var(--line-soft); transition:background .12s ease;
  }
  .video-list-item:hover{background:rgba(255,255,255,.04);}
  .video-list-item.active{background:rgba(201,162,39,.12);}
  .video-list-index{
    font-family:var(--font-mono); font-weight:600; font-size:12px; color:var(--cream-dim);
    width:22px; flex:0 0 auto;
  }
  .video-list-item.active .video-list-index{color:var(--gold-soft);}
  .video-list-label{font-size:14px; font-weight:500;}
  .video-list-item.active .video-list-label{color:var(--gold-soft);}
  .video-list-play{margin-left:auto; font-size:12px; color:var(--gold-soft); opacity:0;}
  .video-list-item.active .video-list-play{opacity:1;}
  .sidebar-empty{padding:20px; font-size:13px; color:var(--cream-dim); line-height:1.6;}

  @media (max-width: 860px){
    .modal-panel{flex-direction:column; max-height:94vh;}
    .modal-sidebar{width:100%; border-left:none; border-top:1px solid var(--line); max-height:220px;}
  }

  @media (max-width: 900px){
    .home-layout{flex-direction:column; gap:32px;}
    .home-text{flex:none; width:100%;}
  }
  @media (max-width: 720px){
    header.top-bar{padding:16px 20px;}
    .content-pad{padding:0 20px 60px;}
    .schedule-banner-content{left:20px; right:20px;}
    .tile-grid{grid-template-columns:1fr;}
    table.schedule-grid{min-width:520px;}
    .cell-class{font-size:12.5px;}
    .cell-sub, .cell-state{font-size:10.5px;}
    .chip-time{margin-left:0;}
  }
</style>
</head>
<body>

<!-- ================= GATE ================= -->
<div id="gate-screen">
  <img class="bg-photo" id="gate-bg" alt="">
  <div class="bg-scrim"></div>
  <div class="brackets"><i></i><i></i><i></i><i></i></div>
  <div class="gate-content">
    <div class="gate-eyebrow">WORKSHOP FOOTAGE ARCHIVE</div>
    <div class="gate-title">K예술영재 프로젝트<br>워크숍 아카이브</div>
    <div class="gate-sub">분야별 워크숍 촬영 영상은 관계자 전용입니다.<br>발급받은 접속 코드를 입력해 주세요.</div>
    <div class="code-input-wrap">
      <input id="code-input" class="code-input" placeholder="ACCESS CODE" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off">
      <div class="code-mask" id="code-mask"></div>
    </div>
    <button class="gate-btn" id="gate-submit">입장하기</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-screen" class="hidden">
  <header class="top-bar">
    <div class="brand" id="brand-home">
      <span class="brand-name" id="brand-title">K예술영재 프로젝트</span>
      <span class="brand-tag">Workshop Archive</span>
    </div>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" placeholder="학생 이름으로 전체 영상 검색">
    </div>
    <div class="top-actions">
      <button class="ghost-btn" id="lock-btn">잠금</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home">
      <div class="content-pad">
        <div class="home-layout">
          <div class="home-text">
            <div class="hero-eyebrow">4 DISCIPLINES ARCHIVED</div>
            <div class="hero-title">분야를 선택해 주세요</div>
            <div class="hero-desc">각 분야를 선택하면 전체 워크숍 일정표가 표시됩니다. 원하는 시간대를 클릭하면 해당 세션의 촬영 영상을 바로 확인할 수 있습니다.</div>
          </div>
          <div class="tile-grid" id="tile-grid"></div>
        </div>
      </div>
    </section>

    <!-- SCHEDULE -->
    <section id="view-schedule" class="hidden">
      <div class="schedule-banner">
        <img id="schedule-photo" alt="">
        <div class="scrim"></div>
        <div class="schedule-banner-content">
          <button class="back-btn" id="back-from-schedule">←</button>
          <div class="schedule-title" id="schedule-title"></div>
        </div>
      </div>
      <div class="content-pad">
        <div id="schedule-body"></div>
      </div>
    </section>

    <!-- SEARCH RESULTS -->
    <section id="view-search" class="hidden">
      <div class="content-pad view-pad">
        <div class="view-header" style="display:flex; align-items:center; gap:16px; margin-bottom:8px;">
          <button class="back-btn" id="back-from-search" style="background:transparent; border:1px solid var(--line); color:var(--cream-dim);">←</button>
          <div class="schedule-title" style="font-size:26px;">검색 결과</div>
        </div>
        <div id="search-body" style="margin-top:28px;"></div>
      </div>
    </section>
  </main>
</div>

<!-- ================= VIDEO MODAL ================= -->
<div id="video-modal" class="modal-backdrop hidden">
  <div class="modal-panel">
    <div class="brackets"><i></i><i></i><i></i><i></i></div>
    <div class="modal-main">
      <div class="modal-head">
        <div>
          <div class="modal-eyebrow" id="modal-field"></div>
          <div class="modal-title" id="modal-class"></div>
        </div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="video-frame" id="video-frame"></div>
      <div class="modal-meta">
        <div>날짜 · 시간<br><b id="modal-time"></b></div>
        <div>지도교수<br><b id="modal-instructor"></b></div>
        <div>장소<br><b id="modal-location"></b></div>
        <div id="modal-note-wrap" class="hidden">비고<br><b id="modal-note"></b></div>
      </div>
    </div>
    <div class="modal-sidebar">
      <div class="sidebar-head" id="sidebar-head">영상 목록</div>
      <div id="video-list"></div>
    </div>
  </div>
</div>

<script>
let DATA = null;
let currentDiscipline = null;

const gateScreen = document.getElementById('gate-screen');
const appScreen = document.getElementById('app-screen');
const codeInput = document.getElementById('code-input');
const codeMask = document.getElementById('code-mask');
const gateError = document.getElementById('gate-error');

/* ---------- Hangul(2-beolsik) -> QWERTY key conversion ---------- */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JAMO_KEY = {
  'ㄱ':'r','ㄲ':'R','ㄴ':'s','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
  'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅛ':'y','ㅜ':'n','ㅠ':'b','ㅡ':'m','ㅣ':'l'
};
const COMPOUND_KEY = {
  'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt',
  'ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅢ':'ml'
};
function jamoToKey(j){ return JAMO_KEY[j] || COMPOUND_KEY[j] || j; }
function hangulSyllableToKeys(ch){
  const code = ch.charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return null;
  const cho = Math.floor(code / 588);
  const jung = Math.floor((code % 588) / 28);
  const jong = code % 28;
  let out = jamoToKey(CHO[cho]) + jamoToKey(JUNG[jung]);
  if(jong > 0) out += jamoToKey(JONG[jong]);
  return out;
}
function convertHangulToEnglish(str){
  let out = '';
  for(const ch of str){
    const keys = hangulSyllableToKeys(ch);
    out += (keys !== null) ? keys : (JAMO_KEY[ch] || ch);
  }
  return out;
}

codeInput.addEventListener('input', () => {
  codeMask.textContent = '*'.repeat(codeInput.value.length);
});

fetch('data.json').then(r => r.json()).then(json => {
  DATA = json;
  document.getElementById('brand-title').textContent = DATA.projectName || 'K예술영재 프로젝트';
  if(DATA.heroPhoto){
    document.getElementById('gate-bg').src = DATA.heroPhoto;
  }
  if(sessionStorage.getItem('karts_auth') === '1'){
    enterApp();
  }
}).catch(() => {
  gateError.textContent = '데이터를 불러오지 못했습니다. data.json 파일 위치를 확인해 주세요.';
});

document.getElementById('gate-submit').addEventListener('click', tryEnter);
codeInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryEnter(); });

function tryEnter(){
  if(!DATA){ gateError.textContent = '데이터 로딩 중입니다. 잠시 후 다시 시도해 주세요.'; return; }
  const raw = codeInput.value.trim();
  if(raw.length === 0){ gateError.textContent = '접속 코드를 입력해 주세요.'; return; }
  const val = convertHangulToEnglish(raw);
  if(val.toUpperCase() === String(DATA.accessCode).toUpperCase()){
    sessionStorage.setItem('karts_auth', '1');
    enterApp();
  } else {
    gateError.textContent = '접속 코드가 올바르지 않습니다.';
  }
}

function enterApp(){
  gateScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
  renderHome();
}

document.getElementById('lock-btn').addEventListener('click', () => {
  sessionStorage.removeItem('karts_auth');
  appScreen.classList.add('hidden');
  gateScreen.classList.remove('hidden');
  codeInput.value = '';
  gateError.textContent = '';
});

document.getElementById('brand-home').addEventListener('click', () => showView('home'));

function showView(name){
  ['home','schedule','search'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('hidden', v !== name);
  });
}

/* ---------- HOME ---------- */
function renderHome(){
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = '';
  DATA.disciplines.forEach(d => {
    const sessionCount = d.schedule.length;
    const videoCount = d.schedule.reduce((sum, s) => sum + ((s.videos||[]).length), 0);
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.setProperty('--c', d.color);
    tile.innerHTML = `
      <img src="${d.photo}" alt="${d.name}">
      <div class="tile-scrim"></div>
      <div class="brackets"><i></i><i></i><i></i><i></i></div>
      <div class="tile-content">
        <div class="tile-eng">${d.englishLabel || ''}</div>
        <div class="tile-name">${d.name}</div>
        <div class="tile-meta">${sessionCount}개 세션 · 영상 ${videoCount}개 보유</div>
      </div>
    `;
    tile.addEventListener('click', () => openDiscipline(d.id));
    grid.appendChild(tile);
  });
  showView('home');
}

/* ---------- SCHEDULE ---------- */
function openDiscipline(id){
  currentDiscipline = DATA.disciplines.find(d => d.id === id);
  if(!currentDiscipline) return;
  document.getElementById('schedule-title').textContent = currentDiscipline.name + ' 워크숍 일정표';
  document.getElementById('schedule-photo').src = currentDiscipline.photo;

  const byDate = {};
  currentDiscipline.schedule.forEach(s => {
    (byDate[s.date] = byDate[s.date] || []).push(s);
  });
  const dates = Object.keys(byDate).sort();

  const body = document.getElementById('schedule-body');
  body.innerHTML = '';
  if(dates.length === 0){
    body.innerHTML = `<div class="empty-state"><div class="big">등록된 일정이 없습니다</div>아직 이 분야의 워크숍 세션이 등록되지 않았습니다.</div>`;
    showView('schedule');
    return;
  }

  body.appendChild(buildScheduleTable(dates, byDate, currentDiscipline));
  showView('schedule');
}

const WEEKDAY_KR = ['일','월','화','수','목','금','토'];

function timeToMinutes(hhmm){
  const [h, m] = hhmm.trim().split(':').map(Number);
  return h * 60 + m;
}

function parseRange(rangeStr){
  const [startStr, endStr] = rangeStr.split('–').map(s => s.trim());
  return { start: timeToMinutes(startStr), end: timeToMinutes(endStr) };
}

function buildScheduleTable(dates, byDate, discipline){
  // 1) compute each entry's start/end in minutes, and the overall time bounds
  const parsed = {};
  let gridStart = Infinity, gridEnd = -Infinity;
  dates.forEach(date => {
    parsed[date] = byDate[date].map(s => {
      const r = parseRange(s.time);
      gridStart = Math.min(gridStart, r.start);
      gridEnd = Math.max(gridEnd, r.end);
      return { entry: s, start: r.start, end: r.end };
    }).sort((a,b) => a.start - b.start);
  });
  gridStart = Math.floor(gridStart / 30) * 30;
  gridEnd = Math.ceil(gridEnd / 30) * 30;
  const slotCount = Math.max(1, (gridEnd - gridStart) / 30);

  // 2) build a per-day matrix of slots: null (free), 'SPANNED' (covered by a rowspan above), or {entry, span}
  const matrix = {};
  dates.forEach(date => {
    const col = new Array(slotCount).fill(null);
    parsed[date].forEach(({entry, start, end}) => {
      const startSlot = Math.round((start - gridStart) / 30);
      const span = Math.max(1, Math.round((end - start) / 30));
      if(startSlot < 0 || startSlot >= slotCount) return;
      col[startSlot] = { entry, span };
      for(let i = 1; i < span && (startSlot + i) < slotCount; i++){
        col[startSlot + i] = 'SPANNED';
      }
    });
    matrix[date] = col;
  });

  // 3) render the table
  const wrap = document.createElement('div');
  wrap.className = 'schedule-table-wrap';
  const table = document.createElement('table');
  table.className = 'schedule-grid';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  headRow.innerHTML = '<th class="time-col">시간</th>';
  dates.forEach((date, i) => {
    const [y,m,d] = date.split('-').map(Number);
    const wd = WEEKDAY_KR[new Date(y, m-1, d).getDay()];
    const th = document.createElement('th');
    th.innerHTML = `<div class="th-day-label">DAY ${i+1}</div><div class="th-day-sub">${m}.${d}(${wd})</div>`;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for(let slot = 0; slot < slotCount; slot++){
    const tr = document.createElement('tr');
    const mins = gridStart + slot * 30;
    const hh = String(Math.floor(mins/60)).padStart(2,'0');
    const mm = String(mins%60).padStart(2,'0');
    const timeTd = document.createElement('td');
    timeTd.className = 'time-col';
    timeTd.textContent = `${hh}:${mm}`;
    tr.appendChild(timeTd);

    dates.forEach(date => {
      const cell = matrix[date][slot];
      if(cell === 'SPANNED') return; // covered by a rowspan above, emit nothing
      if(cell === null){
        const td = document.createElement('td');
        td.className = 'cell-empty';
        tr.appendChild(td);
        return;
      }
      const { entry, span } = cell;
      const videos = entry.videos || [];
      const hasVideo = videos.length > 0;
      const td = document.createElement('td');
      td.className = 'cell-session';
      td.rowSpan = span;
      td.innerHTML = `
        <div class="cell-class">${entry.className}</div>
        <div class="cell-sub">${entry.instructor || ''}${entry.location ? ' · ' + entry.location : ''}</div>
        ${entry.note ? `<div class="cell-note">${entry.note}</div>` : ''}
        <div class="cell-state ${hasVideo ? 'ready' : ''}">${hasVideo ? '● 영상 ' + videos.length + '개' : '영상 준비중'}</div>
      `;
      td.addEventListener('click', () => openVideoModal(entry, discipline));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}
document.getElementById('back-from-schedule').addEventListener('click', () => showView('home'));

/* ---------- SEARCH ---------- */
const searchInput = document.getElementById('search-input');
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 250);
});
searchInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ clearTimeout(searchTimer); runSearch(); } });

function runSearch(){
  const q = searchInput.value.trim();
  if(q.length === 0) return;
  const qLower = q.toLowerCase();

  const byStudent = {};
  DATA.disciplines.forEach(d => {
    d.schedule.forEach(s => {
      (s.students || []).forEach(name => {
        if(name.toLowerCase().includes(qLower)){
          byStudent[name] = byStudent[name] || [];
          byStudent[name].push({entry: s, discipline: d});
        }
      });
    });
  });

  const body = document.getElementById('search-body');
  body.innerHTML = '';
  const names = Object.keys(byStudent).sort();

  if(names.length === 0){
    body.innerHTML = `<div class="empty-state"><div class="big">"${escapeHtml(q)}" 검색 결과가 없습니다</div>학생 이름을 다시 확인해 주세요.</div>`;
  } else {
    names.forEach(name => {
      const block = document.createElement('div');
      block.className = 'student-block';
      const items = byStudent[name].sort((a,b) => (a.entry.date+a.entry.time).localeCompare(b.entry.date+b.entry.time));
      block.innerHTML = `
        <div class="student-name">${name} <span style="font-family:var(--font-mono); font-size:12px; color:var(--cream-dim); font-weight:500;">· 참여 클래스 ${items.length}건</span></div>
        <div class="class-chip-list"></div>
      `;
      const list = block.querySelector('.class-chip-list');
      items.forEach(({entry, discipline}) => {
        const chip = document.createElement('div');
        chip.className = 'class-chip';
        chip.style.setProperty('--c', discipline.color);
        chip.innerHTML = `
          <div class="chip-bar"></div>
          <div>
            <div class="chip-field">${discipline.name}</div>
            <div class="chip-class">${entry.className}</div>
          </div>
          <div class="chip-time">${entry.date.replaceAll('-','.')} · ${entry.time}</div>
        `;
        chip.addEventListener('click', () => openVideoModal(entry, discipline));
        list.appendChild(chip);
      });
      body.appendChild(block);
    });
  }
  showView('search');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
document.getElementById('back-from-search').addEventListener('click', () => { showView('home'); searchInput.value=''; });

/* ---------- VIDEO MODAL ---------- */
const modal = document.getElementById('video-modal');
let currentVideos = [];
let currentVideoIndex = 0;

function openVideoModal(entry, discipline){
  document.getElementById('modal-field').textContent = discipline.name;
  document.getElementById('modal-field').style.setProperty('--c', discipline.color);
  document.getElementById('modal-class').textContent = entry.className;
  document.getElementById('modal-time').textContent = `${entry.date.replaceAll('-','.')} · ${entry.time}`;
  document.getElementById('modal-instructor').textContent = entry.instructor;
  document.getElementById('modal-location').textContent = entry.location || '-';
  const noteWrap = document.getElementById('modal-note-wrap');
  if(entry.note){
    document.getElementById('modal-note').textContent = entry.note;
    noteWrap.classList.remove('hidden');
  } else {
    noteWrap.classList.add('hidden');
  }

  currentVideos = entry.videos || [];
  currentVideoIndex = 0;

  renderVideoList();
  playVideoAt(0);

  modal.classList.remove('hidden');
}

function renderVideoList(){
  const listEl = document.getElementById('video-list');
  const headEl = document.getElementById('sidebar-head');
  listEl.innerHTML = '';
  headEl.textContent = currentVideos.length > 0 ? `영상 목록 (${currentVideos.length})` : '영상 목록';

  if(currentVideos.length === 0){
    listEl.innerHTML = `<div class="sidebar-empty">이 세션에는 아직 업로드된 영상이 없습니다.</div>`;
    return;
  }
  currentVideos.forEach((v, i) => {
    const item = document.createElement('div');
    item.className = 'video-list-item' + (i === currentVideoIndex ? ' active' : '');
    item.innerHTML = `
      <div class="video-list-index">${String(i+1).padStart(2,'0')}</div>
      <div class="video-list-label">${v.label || ('영상 ' + (i+1))}</div>
      <div class="video-list-play">▶</div>
    `;
    item.addEventListener('click', () => {
      currentVideoIndex = i;
      renderVideoList();
      playVideoAt(i);
    });
    listEl.appendChild(item);
  });
}

function playVideoAt(index){
  const frame = document.getElementById('video-frame');
  const v = currentVideos[index];
  if(v && v.vimeoId){
    frame.innerHTML = `<iframe src="https://player.vimeo.com/video/${v.vimeoId}?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  } else {
    frame.innerHTML = `<div class="video-empty">REC PENDING<br><span style="font-family:var(--font-body); color:var(--cream-dim);">아직 업로드된 영상이 없습니다</span></div>`;
  }
}

document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
function closeModal(){
  modal.classList.add('hidden');
  document.getElementById('video-frame').innerHTML = '';
  currentVideos = [];
  currentVideoIndex = 0;
}
</script>
