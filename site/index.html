<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; frame-src https://player.vimeo.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self';">
<title>K예술영재 아카이브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= BOOT (기존 세션 확인 중) ================= -->
<div id="boot-screen" class="hidden">
  <div class="brackets"><i></i><i></i><i></i><i></i></div>
  <div class="boot-content">
    <div class="boot-spinner" id="boot-spinner"></div>
    <div class="boot-error hidden" id="boot-error">
      <div class="boot-error-text" id="boot-error-text"></div>
      <button class="ghost-btn" id="boot-retry-btn">다시 시도</button>
    </div>
  </div>
</div>

<!-- ================= GATE (로그인) ================= -->
<div id="gate-screen" class="hidden">
  <div class="bg-scrim"></div>
  <div class="brackets"><i></i><i></i><i></i><i></i></div>
  <div class="gate-content">
    <div class="gate-eyebrow">ARCHIVE ACCESS</div>
    <div class="gate-title">K예술영재 아카이브</div>
    <div class="gate-sub">교강사 · 운영진 · 발주기관 전용입니다.<br>발급받은 접근코드와 이름을 입력해 주세요.</div>
    <input id="code-input" class="code-input" type="password" placeholder="ACCESS CODE" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off">
    <input id="name-input" class="name-input" placeholder="이름" maxlength="20" autocomplete="off">
    <button class="gate-btn" id="gate-submit">입장하기</button>
    <div class="gate-error" id="gate-error"></div>
    <div class="gate-notice">이 사이트의 자료는 외부 유출·재배포를 금지합니다.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-screen" class="hidden">
  <header class="top-bar">
    <div class="brand" id="brand-home">
      <span class="brand-name">K예술영재 아카이브</span>
      <span class="brand-tag">Archive</span>
    </div>
    <nav class="discipline-switch" id="discipline-switch"></nav>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" placeholder="분야 · 활동명 · 수업명 · 교강사 · 학생 · 장소 검색">
    </div>
    <div class="data-loading hidden" id="data-loading">자료 불러오는 중…</div>
    <div class="top-actions">
      <button class="ghost-btn" id="logout-btn">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="view-discipline" class="view content-pad hidden"></section>
    <section id="view-program" class="view content-pad hidden"></section>
    <section id="view-schedule" class="view content-pad hidden"></section>
    <section id="view-materials" class="view content-pad hidden"></section>
    <section id="view-search" class="view content-pad hidden"></section>
    <section id="view-person" class="view content-pad hidden"></section>
  </main>
</div>

<script src="js/hangul.js"></script>
<script src="js/api.js"></script>
<script src="js/router.js"></script>
<script src="js/view-discipline.js"></script>
<script src="js/view-program.js"></script>
<script src="js/app.js"></script>
</body>
</html>
