# GitHub Pages 배포 설정
#
# 이 저장소는 Pages의 "브랜치에서 배포"(main 브랜치 루트) 방식으로 게시된다.
# 그 방식은 Jekyll 빌드를 거치는데, front matter(맨 위 --- 블록)가 없는 파일은
# 변환 없이 그대로 복사된다. 이 저장소에는 front matter가 있는 파일이 없으므로
# Jekyll은 복사만 하며, 이 설정의 역할은 배포 결과물에서 아래 경로를 빼는 것뿐이다.
#
# 목적: 열람 화면(site/)과 기존 워크숍 아카이브(루트)만 게시하고
#       설계 문서와 관문 코드는 사이트로 내보내지 않는다 (CLAUDE.md 8, docs/decisions.md 6-3).
#
# 주의: 루트에 .nojekyll 파일을 만들면 Jekyll을 건너뛰어 아래 exclude가 무효가 된다.
#       (.으로 시작하는 파일·폴더와 _로 시작하는 폴더는 Jekyll이 기본으로 제외한다.)

exclude:
  - docs
  - apps-script
  - CLAUDE.md
