<style>

  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);}
  a{color:inherit;}
  input,textarea,select{font-family:var(--sans);font-size:13.5px;border:1px solid var(--line);border-radius:5px;padding:9px 11px;width:100%;background:#fff;color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold-tint);border-color:var(--gold);}
  textarea{resize:vertical;min-height:56px;}
  label{font-size:12px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:5px;}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:5px;font-weight:700;font-size:13px;}
  .field{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#081826,#0F2A43,#173A5E);}
  .login-box{background:#fff;border-radius:10px;padding:40px 36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .login-box h1{font-size:18px;font-weight:800;margin-bottom:6px;}
  .login-box p{font-size:12.5px;color:var(--ink-3);margin-bottom:22px;}
  .login-box button{width:100%;background:var(--gold);color:#20170a;padding:12px;margin-top:12px;}
  .login-box .err{color:#c0392b;font-size:12px;margin-top:8px;display:none;}

  #app{display:none;}
  header.topbar{position:fixed;top:0;left:0;right:0;height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:100;}
  header.topbar .title{font-weight:800;font-size:15px;}
  header.topbar .title span{color:var(--gold-dark);}
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .btn{padding:9px 16px;border-radius:5px;font-size:12.5px;font-weight:700;}
  .btn-ghost{background:var(--bg-soft);color:var(--ink);border:1px solid var(--line);}
  .btn-gold{background:var(--gold);color:#20170a;} .btn-gold:hover{background:var(--gold-dark);color:#fff;}
  .btn-outline{background:#fff;color:var(--gold-dark);border:1.5px solid var(--gold);}
  .save-msg{font-size:12px;color:var(--gold-dark);font-weight:700;opacity:0;transition:opacity .3s;}

  .layout{display:flex;padding-top:58px;min-height:100vh;}
  .sidebar{width:190px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);position:fixed;top:58px;bottom:0;left:0;overflow-y:auto;}
  .sidebar button{display:block;width:100%;text-align:left;padding:13px 20px;background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);border-left:3px solid transparent;}
  .sidebar button.active{background:var(--gold-tint);color:var(--gold-dark);border-left-color:var(--gold);}
  .sidebar button:hover{background:var(--bg-soft);}
  .main{margin-left:190px;flex:1;display:flex;}
  .form-pane{flex:1;padding:28px 32px;max-width:640px;}
  .preview-pane{flex:1;background:#eef1f2;padding:20px;position:sticky;top:58px;height:calc(100vh - 58px);}
  .preview-pane iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .panel-title{font-size:19px;font-weight:800;margin-bottom:4px;}
  .panel-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:24px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .card-head h4{font-size:13.5px;font-weight:800;}
  .mini-btn{background:var(--bg-soft);border:1px solid var(--line);padding:6px 10px;font-size:11.5px;border-radius:4px;color:var(--ink-2);}
  .mini-btn:hover{color:#c0392b;border-color:#c0392b;}
  .add-btn{background:var(--gold-tint);color:var(--gold-dark);padding:10px;border-radius:6px;font-size:12.5px;width:100%;margin-top:6px;}
  .add-btn:hover{background:var(--gold);color:#fff;}

  .list-item{border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:10px;background:var(--bg-soft);}
  .divider{height:1px;background:var(--line);margin:22px 0;}
  .range-row{display:flex;align-items:center;gap:10px;}
  .range-row input[type=range]{flex:1;}
  .range-row span{font-size:12px;color:var(--ink-2);width:34px;text-align:right;}

</div>

      <button class="btn btn-outline" onclick="saveDraft()">임시저장 (미리보기)</button>
      <button class="btn btn-gold" onclick="exportJson()">data.json 내보내기</button>
    </div>
  </header>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="form-pane" id="formPane"></div>
      <div class="preview-pane"><iframe id="previewFrame" src="index.html?preview=1"></iframe></div>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'kartsgifted2026';
const DRAFT_KEY = 'kgifted_draft';

function tryLogin(){
  const v = document.getElementById('pwInput').value;
  if(v === PASSWORD){
    sessionStorage.setItem('kgifted_admin_auth','1');
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    boot();
  } else { document.getElementById('loginErr').style.display='block'; }
}
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
if(sessionStorage.getItem('kgifted_admin_auth') === '1'){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  window.addEventListener('DOMContentLoaded', boot);
}

let state = null;
const TABS = [
  {key:'meta', label:'기본정보'},
  {key:'hero', label:'히어로 (HOME)'},
  {key:'intro', label:'프로젝트 소개'},
  {key:'workshop', label:'분야별 워크숍'},
  {key:'mentoring', label:'멘토링'},
  {key:'camp', label:'겨울캠프'},
  {key:'media', label:'미디어'},
  {key:'news', label:'소식'},
  {key:'footer', label:'푸터'}
];
let currentTab = 'hero';

async function boot(){
  try{
    const draft = localStorage.getItem(DRAFT_KEY);
    if(draft){ state = JSON.parse(draft); }
    else { const res = await fetch('data.json', {cache:'no-store'}); state = res.ok ? await res.json() : JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  }catch(e){ state = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  buildSidebar(); renderTab(currentTab);
}
function resetToDefault(){
  if(!confirm('현재 편집 중인 모든 내용을 기본값으로 되돌립니다. 계속할까요?')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  renderTab(currentTab);
  flash('기본값으로 초기화되었습니다 (아직 임시저장 전)');
}
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = TABS.map(t=>`<button data-tab="${t.key}" class="${t.key===currentTab?'active':''}">${t.label}</button>`).join('');
  sb.querySelectorAll('button').forEach(b=>{ b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; buildSidebar(); renderTab(currentTab); }); });
}
function flash(msg){ const el = document.getElementById('saveMsg'); el.textContent = msg; el.style.opacity = '1'; setTimeout(()=> el.style.opacity='0', 1800); }
function saveDraft(){
  localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
  document.getElementById('previewFrame').src = 'index.html?preview=1&t=' + Date.now();
  flash('임시저장됨 · 미리보기 갱신');
}
function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'data.json'; a.click();
  URL.revokeObjectURL(url);
  flash('data.json 다운로드됨');
}

/* ---------- helpers ---------- */
function field(labelText, inputHtml){ return `<div class="field"><label>${labelText}</label>${inputHtml}</div>`; }
function bindInput(sel, path, isArray, delim){
  document.querySelectorAll(sel).forEach(inp=>{
    inp.addEventListener('input', ()=>{
      let val = inp.value;
      if(isArray) val = val.split(delim||'\n').map(s=>s.trim()).filter(Boolean);
      setPath(state, path, val);
    });
  });
}
function setPath(obj, path, val){
  const keys = path.split('.'); let cur = obj;
  for(let i=0;i<keys.length-1;i++){
    let k = keys[i];
    if(k.includes('[')){ const [base, idx] = k.split('['); cur = cur[base][parseInt(idx)]; } else cur = cur[k];
  }
  let lastKey = keys[keys.length-1];
  if(lastKey.includes('[')){ const [base, idx] = lastKey.split('['); cur[base][parseInt(idx)] = val; } else cur[lastKey] = val;
}
function getPath(obj, path){
  const keys = path.split('.'); let cur = obj;
  for(const k of keys){
    if(k.includes('[')){ const [base, idx] = k.split('['); cur = cur[base][parseInt(idx)]; } else cur = cur[k];
  }
  return cur;
}
function esc(str){ return String(str==null?'':str).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function bindBgEditor(sectionKey){
  const typeSel = document.getElementById(`bgtype-${sectionKey}`);
  const urlWrap = document.getElementById(`bgurl-wrap-${sectionKey}`);
  const urlInput = document.getElementById(`bgurl-${sectionKey}`);
  const fileInput = document.getElementById(`bgfile-${sectionKey}`);
  const ovInput = document.getElementById(`bgov-${sectionKey}`);
  const ovVal = document.getElementById(`bgov-val-${sectionKey}`);
  const hint = document.getElementById(`bghint-${sectionKey}`);
  const hints = {
    image:'고화질 이미지 URL을 붙여넣거나, 아래에서 파일을 직접 업로드하세요 (업로드 파일은 저장 시 페이지에 포함됩니다. 3MB 이하 권장).',
    video:'mp4로 인코딩된 동영상 파일의 URL을 입력하세요. 대용량 파일은 업로드를 지원하지 않으니 자체 호스팅 URL을 사용하세요.',
    youtube:'유튜브 영상 URL을 붙여넣으세요. 자동 재생·반복 배경으로, 재생버튼·자막 없이 표시됩니다.',
    vimeo:'비메오 영상 URL을 붙여넣으세요 (예: https://vimeo.com/123456789). 비메오의 배경 재생 모드로 컨트롤·제목 없이 자동 재생·반복됩니다.',
    gradient:''
  };
  hint.textContent = hints[state.sections[sectionKey].bg.type] || '';
  typeSel.addEventListener('change', ()=>{
    const t = typeSel.value; state.sections[sectionKey].bg.type = t;
    urlWrap.style.display = t==='gradient' ? 'none' : 'block';
    fileInput.style.display = t==='image' ? 'block' : 'none';
    hint.textContent = hints[t] || '';
  });
  urlInput.addEventListener('input', ()=>{ state.sections[sectionKey].bg.url = urlInput.value; });
  fileInput.addEventListener('change', ()=>{
    const f = fileInput.files[0]; if(!f) return;
    if(f.size > 3*1024*1024){ alert('이미지는 3MB 이하 파일을 권장합니다. 더 큰 파일은 URL 방식을 사용해주세요.'); }
    const reader = new FileReader();
    reader.onload = ()=>{ state.sections[sectionKey].bg.url = reader.result; urlInput.value = '(업로드된 이미지)'; };
    reader.readAsDataURL(f);
  });
  ovInput.addEventListener('input', ()=>{ state.sections[sectionKey].bg.overlay = parseFloat(ovInput.value); ovVal.textContent = Math.round(ovInput.value*100)+'%'; });
}

/* ---------- list editor ---------- */
function renderListEditor(containerId, arrPath, itemRenderer, emptyItem, label){
  const arr = getPath(state, arrPath);
  const container = document.getElementById(containerId);
  container.innerHTML = arr.map((item, i)=> itemRenderer(item, i)).join('') + `<button class="add-btn" id="${containerId}-add">+ ${label} 추가</button>`;
  document.getElementById(`${containerId}-add`).addEventListener('click', ()=>{
    arr.push(JSON.parse(JSON.stringify(emptyItem)));
    renderListEditor(containerId, arrPath, itemRenderer, emptyItem, label);
    bindCurrentTabInputs();
  });
  container.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      arr.splice(parseInt(btn.dataset.remove), 1);
      renderListEditor(containerId, arrPath, itemRenderer, emptyItem, label);
      bindCurrentTabInputs();
    });
  });
}
